name: pixelrp

networks:
  pixelrp:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  dbdata:
  bot-memory:
  # Housekeeping-uploaded game images (ads backgrounds, badge parts): written
  # by the cms (php-fpm as www-data), served read-only by web at /gamedata/.
  gamedata:

services:
  db:
    image: mysql:8.0
    command: --sql-mode=NO_ENGINE_SUBSTITUTION --character-set-server=utf8mb4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      # Consumed by docker-entrypoint-initdb.d/02-bot-user.sh (first init only).
      BOT_DB_USER: ${BOT_DB_USER:-}
      BOT_DB_PASSWORD: ${BOT_DB_PASSWORD:-}
    volumes:
      - dbdata:/var/lib/mysql
      - ./emulator/Resources/SQLs/Original Database.sql:/docker-entrypoint-initdb.d/01-plusemu.sql:ro
      - ./docker/db/create-bot-user.sh:/docker-entrypoint-initdb.d/02-bot-user.sh:ro
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      pixelrp:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20

  emulator:
    build:
      context: .
      dockerfile: docker/emulator/Dockerfile
    tty: true
    stdin_open: true
    # PerformShutDown() broadcasts, saves every inventory and resets
    # server_status before exiting; give it time before SIGKILL.
    stop_grace_period: 60s
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      NITRO_PORT: ${NITRO_PORT}
      RCON_PORT: ${RCON_PORT}
      RCON_ALLOWED_IP: ${RCON_ALLOWED_IP}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${NITRO_PORT}:${NITRO_PORT}"
    volumes:
      - ./nitro/assets/c_images/camera:/camera-storage
    networks:
      pixelrp:
        ipv4_address: 172.28.0.30

  cms:
    build:
      context: .
      dockerfile: docker/cms/Dockerfile
    # No env_file here: the root .env holds secrets for other services (bot
    # API key/DB creds) that must not reach the CMS — the most exposed
    # container. Everything the CMS needs is listed explicitly below or lives
    # in cms/.env.
    environment: &cms-env
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${HTTP_PORT}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_NAME}
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      EMULATOR_DRIVER: plus
      RCON_HOST: emulator
      RCON_PORT: ${RCON_PORT}
      DEPLOY_CHANGELOG_PATH: /changelog/CHANGELOG.md
    volumes:
      - ./cms:/var/www/html
      # /api/deploy-status serves the newest release notes from here (outside
      # /var/www/html — a file mount inside the ./cms bind mount fails).
      - ./CHANGELOG.md:/changelog/CHANGELOG.md:ro
      - gamedata:/var/www/gamedata
    depends_on:
      db:
        condition: service_healthy
    networks:
      pixelrp:
        ipv4_address: 172.28.0.20

  # Laravel scheduler runner (Discord queue/sweep, paypal:reconcile). Same
  # image and config as cms, but runs `schedule:work` instead of php-fpm.
  # Shares the cms storage (file cache) so withoutOverlapping mutexes are
  # visible to both containers. NO static IP — it serves nothing, and both
  # the prod and beta overlays assign their own addresses to the web-facing
  # services only.
  cms-scheduler:
    build:
      context: .
      dockerfile: docker/cms/Dockerfile
    command: ["php", "artisan", "schedule:work"]
    environment: *cms-env
    volumes:
      - ./cms:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pixelrp

  web:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/web/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./cms:/var/www/html:ro
      - ./nitro:/var/www/nitro-assets:ro
      - gamedata:/var/www/gamedata:ro
    ports:
      - "127.0.0.1:${HTTP_PORT}:80"
    depends_on:
      - cms
      - emulator
    networks:
      pixelrp:
        ipv4_address: 172.28.0.40

  bot:
    build:
      context: bot
    environment:
      BOT_ENABLED: ${BOT_ENABLED:-true}
      WS_URL: ws://emulator:${NITRO_PORT}
      DB_HOST: db
      # The bot only ever mints SSO tickets (UPDATE users.auth_ticket), so it
      # gets the dedicated low-privilege user when one is configured; the
      # fallback to the app user keeps databases initialized before
      # 02-bot-user.sh existed working until the grant is applied by hand.
      DB_USER: ${BOT_DB_USER:-${DB_USER}}
      DB_PASSWORD: ${BOT_DB_PASSWORD:-${DB_PASSWORD}}
      DB_NAME: ${DB_NAME}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      BOT_USERNAME: ClaudeTest
      BOT_HOME_ROOM: "2"
      MEMORY_PATH: /data/memory.md
    volumes:
      - bot-memory:/data
    depends_on:
      db:
        condition: service_healthy
      emulator:
        condition: service_started
    networks:
      - pixelrp
    restart: unless-stopped
