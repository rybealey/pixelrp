; pixelrp: the php-fpm pool, read after the image's www.conf and docker.conf.
; The image's default was 5 workers, so a few slow requests queued everyone
; else. PHP_FPM_MAX_CHILDREN is per hotel - 8 by default (prod, Dockerfile),
; 4 on beta (compose.beta.yaml) - at roughly 60 MB each on a shared 4 GB box.
[www]
pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 1000

; The image logs every request a second time; nginx already logs them.
access.log = /dev/null
