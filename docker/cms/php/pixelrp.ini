; pixelrp: on top of php.ini-production (docker/cms/Dockerfile). The image ran
; with no php.ini at all, so it had PHP's built-in development defaults.

; As before: environment variables reach $_ENV too (production's GPCS drops E).
variables_order = "EGPCS"

; Compiled PHP kept in shared memory. Sized for Laravel + Filament + vendor
; with room to spare; the box is 4 GB and runs two hotels (prod and beta).
opcache.enable = 1
opcache.memory_consumption = 160
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; Remember resolved file paths - Laravel stats thousands of files a request.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
