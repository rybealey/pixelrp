# Host nginx vhost for pixelrp.co — deploy to /etc/nginx/sites-enabled/pixelrp
# then `nginx -t && systemctl reload nginx`.
#
# This is the public edge on the VPS: it terminates TLS with the Cloudflare
# origin certs and proxies to the loopback-bound compose services.
#   https://pixelrp.co      -> 127.0.0.1:8080  (web container / CMS + Nitro assets)
#   wss://pixelrp.co:2096   -> 127.0.0.1:2096  (emulator Nitro WebSocket)
# 2096 is one of Cloudflare's proxied HTTPS ports, so the game socket stays
# behind the CDN like the site does.

ssl_certificate     /etc/ssl/pixelrp/origin.pem;
ssl_certificate_key /etc/ssl/pixelrp/origin.key;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_session_cache   shared:pixelrp:10m;

# Recover the real client IP from Cloudflare, then hand the app a single
# trustworthy value. Without the CIDR list below, $remote_addr is Cloudflare's
# edge and every visitor collapses into one rate-limit bucket.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    # `listen ... http2` (not the 1.25+ standalone `http2 on;`) — the VPS runs
    # nginx 1.24, where the separate directive doesn't exist.
    listen 443 ssl http2;
    server_name pixelrp.co www.pixelrp.co;
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # OVERWRITE, never $proxy_add_x_forwarded_for: appending would let a
        # client inject its own X-Forwarded-For, and Laravel (TRUSTED_PROXIES)
        # would believe the leftmost value — forging request()->ip() and
        # bypassing the guest throttle and the accounts-per-IP registration cap.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
    }
}

# Nitro game socket. The emulator has no X-Forwarded-For awareness, so the
# source IP it sees is the docker gateway regardless; this block exists to
# terminate TLS for wss:// and hold the connection open.
server {
    listen 2096 ssl;
    server_name pixelrp.co www.pixelrp.co;

    location / {
        # 12096, not 2096: this server block already owns :2096 on every
        # interface, so the emulator container publishes on 12096 instead.
        proxy_pass http://127.0.0.1:12096;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}

# Direct (Cloudflare-bypassed) game socket: ws.pixelrp.co is a grey-cloud
# DNS-only record straight to the VPS, so walk packets skip the CDN edge —
# measured CF proxying added 200-1600ms delay spikes with bunched delivery
# (steps arriving 0-90ms apart), the stall/teleport players felt. SNI routes
# this hostname here; it needs a browser-trusted cert (Let's Encrypt), since
# the Cloudflare origin cert above is only trusted by Cloudflare itself.
server {
    listen 2096 ssl;
    server_name ws.pixelrp.co;

    ssl_certificate     /etc/letsencrypt/live/ws.pixelrp.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ws.pixelrp.co/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:12096;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
