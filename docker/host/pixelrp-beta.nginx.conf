# Host nginx vhost for beta.pixelrp.co — deploy to
# /etc/nginx/sites-enabled/pixelrp-beta then `nginx -t && systemctl reload nginx`.
#
# Sits alongside the prod vhost (pixelrp.nginx.conf) and inherits its
# http-level ssl_certificate (the Cloudflare origin cert covers
# *.pixelrp.co) and the real-IP recovery directives.
#   https://beta.pixelrp.co       -> 127.0.0.1:8081  (beta web container)
#   wss://beta.pixelrp.co:2096    -> 127.0.0.1:12097 (beta emulator socket, via CF)
#   wss://play.pixelrp.co:2097    -> 127.0.0.1:12097 (beta emulator socket, direct)
# SNI routes 2096 between prod and beta — both listen on the port, nginx
# picks the server block by hostname. The direct (Cloudflare-bypassed) socket
# instead distinguishes prod/beta by PORT on the single grey-cloud hostname:
# play:2096 -> prod (block in pixelrp.nginx.conf), play:2097 -> beta (below);
# direct connections aren't limited to Cloudflare's proxied-port list.

server {
    listen 443 ssl http2;
    server_name beta.pixelrp.co;
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # OVERWRITE, never $proxy_add_x_forwarded_for — same forgery concern
        # as the prod vhost.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
    }
}

server {
    listen 2096 ssl;
    server_name beta.pixelrp.co;

    location / {
        proxy_pass http://127.0.0.1:12097;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}

# Direct (Cloudflare-bypassed) beta game socket — see the play.pixelrp.co
# block in pixelrp.nginx.conf for the rationale. Same Let's Encrypt cert;
# ufw must allow 2097 from Anywhere (direct traffic isn't Cloudflare's).
server {
    listen 2097 ssl;
    server_name play.pixelrp.co;

    ssl_certificate     /etc/letsencrypt/live/play.pixelrp.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/play.pixelrp.co/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:12097;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
