# pixelrp: the asset pass check, included in every protected /nitro-assets/
# location (docs/asset-protection-plan.md). The CMS issues three cookies when
# /game loads (App\Support\AssetPass), scoped to Path=/nitro-assets/:
#   prp_ap_u  user id
#   prp_ap_e  expiry, unix seconds
#   prp_ap_s  base64url(md5("<expiry><user id> <secret>")), unpadded
# secure_link recomputes the hash with the shared secret: "" means missing or
# forged, "0" means expired. Only `return` is ever inside these ifs, which is
# the safe use of `if` in a location.
secure_link     $cookie_prp_ap_s,$cookie_prp_ap_e;
secure_link_md5 "$secure_link_expires$cookie_prp_ap_u $asset_pass_secret";

if ($secure_link = "")  { return 403; }
if ($secure_link = "0") { return 403; }

# Every gated file is attributed to the account that fetched it - the scrape
# detector (and the Phase 3 thresholds) read these lines from `docker logs`.
access_log /dev/stdout assets;
