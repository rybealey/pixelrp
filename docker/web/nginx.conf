worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  sendfile on;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 80;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 25m;

    # Gamedata JSON (FurnitureData/FigureData/FigureMap/etc.) is mutable - it's
    # regenerated by the nitro-converter recipe (docker/nitro/README.md) and can
    # be hand-patched (e.g. a bad entry fixed in place), unlike the versioned
    # client bundle and the content-hashed .nitro bundles below it. A long
    # max-age here means every browser that has ever loaded the hotel keeps
    # serving itself a stale, possibly-broken copy for up to a week with no way
    # to pick up a fix short of a manual hard-refresh. Matched before the
    # general /nitro-assets/ rule so it takes precedence.
    location /nitro-assets/assets/gamedata/ {
      alias /var/www/nitro-assets/assets/gamedata/;
      add_header Cache-Control "no-store";
    }

    # Same reasoning as gamedata above, and just as important: these two files
    # are what the client reads first (index.html's NitroConfig["config.urls"])
    # to learn every other asset URL, including the gamedata ones. Caching them
    # for a week means a browser that loaded the client once keeps using a
    # stale config indefinitely, silently undoing the no-store rule above by
    # requesting gamedata through whatever URLs *that* stale config still
    # points at.
    location ~ ^/nitro-assets/client/(renderer-config\.json|ui-config\.json)$ {
      alias /var/www/nitro-assets/client/$1;
      add_header Cache-Control "no-store";
    }

    location /nitro-assets/ {
      alias /var/www/nitro-assets/;
      add_header Cache-Control "public, max-age=604800";
    }

    location /ws {
      proxy_pass http://emulator:2096;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
    }

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
      fastcgi_pass cms:9000;
      fastcgi_index index.php;
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    }
  }
}
