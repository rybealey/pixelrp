worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  # nitro-renderer's AssetManager only parses a bundle when the response
  # Content-Type is exactly application/octet-stream; anything else (nginx's
  # text/plain fallback for unknown extensions) is silently skipped and the
  # client hangs at 80% on the loading screen.
  types { application/octet-stream nitro; }
  sendfile on;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # pixelrp: the asset pass (asset-gate.conf, docs/asset-protection-plan.md).
  # $asset_pass_secret is rendered from the environment at start.
  include /etc/nginx/conf.d/asset-pass.conf;
  # One line per gated file: the client IP the host nginx recovered from
  # Cloudflare, then the account. "ASSET" makes them easy to pull out of
  # `docker logs` among the ordinary access lines.
  log_format assets 'ASSET $http_x_real_ip $cookie_prp_ap_u [$time_local] $status $body_bytes_sent "$uri"';

  server {
    listen 80;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 25m;

    # pixelrp: everything under /nitro-assets/ except the two image trees
    # below is for logged-in players only - asset-gate.conf turns away any
    # request without a valid asset pass (docs/asset-protection-plan.md). No
    # Access-Control-Allow-Origin anywhere here: the client, the CMS pages and
    # the Vite dev server (which proxies /nitro-assets) are all same-origin,
    # and the old wildcard let any other hotel's client load our bundles
    # straight off this server. Cache-Control is "private" on gated files so
    # no shared cache - Cloudflare included - ever stores one and serves it
    # past the gate.

    # Public images: the website shows badges and furni icons to visitors who
    # have never opened the game, so they carry no pass. Cloudflare's Hotlink
    # Protection (GIF/PNG/JPG) guards them instead. ^~ so no regex location
    # below can claim them.
    location ^~ /nitro-assets/assets/c_images/ {
      alias /var/www/nitro-assets/assets/c_images/;
      add_header Cache-Control "public, max-age=604800";
    }

    location ^~ /nitro-assets/assets/dcr/hof_furni/icons/ {
      alias /var/www/nitro-assets/assets/dcr/hof_furni/icons/;
      add_header Cache-Control "public, max-age=604800";
    }

    # Gamedata JSON (FurnitureData/FigureData/FigureMap/etc.) is mutable - it's
    # regenerated by the nitro-converter recipe (docker/nitro/README.md) and can
    # be hand-patched (e.g. a bad entry fixed in place), unlike the versioned
    # client bundle and the content-hashed .nitro bundles below it. A long
    # max-age here means every browser that has ever loaded the hotel keeps
    # serving itself a stale, possibly-broken copy for up to a week with no way
    # to pick up a fix short of a manual hard-refresh. Matched before the
    # general /nitro-assets/ rule so it takes precedence.
    location /nitro-assets/assets/gamedata/ {
      include /etc/nginx/asset-gate.conf;
      alias /var/www/nitro-assets/assets/gamedata/;
      add_header Cache-Control "no-store";
    }

    # Same reasoning as gamedata above, and just as important: these two files
    # are what the client reads first (index.html's NitroConfig["config.urls"])
    # to learn every other asset URL, including the gamedata ones. Caching them
    # for a week means a browser that loaded the client once keeps using a
    # stale config indefinitely, silently undoing the no-store rule above by
    # requesting gamedata through whatever URLs *that* stale config still
    # points at.
    location ~ ^/nitro-assets/client/(renderer-config\.json|ui-config\.json)$ {
      include /etc/nginx/asset-gate.conf;
      alias /var/www/nitro-assets/client/$1;
      add_header Cache-Control "no-store";
    }

    # The client entry document is the third leg of the same problem: it
    # references the content-hashed bundle filenames, so a week-cached
    # index.html pins every returning browser to a stale build (deploys
    # appear to do nothing until a manual hard-refresh). The hashed
    # assets it points to stay long-cached below — only the pointer must
    # revalidate.
    location ~ ^/nitro-assets/client/(index\.html)?$ {
      include /etc/nginx/asset-gate.conf;
      alias /var/www/nitro-assets/client/index.html;
      add_header Cache-Control "no-store";
    }

    location /nitro-assets/ {
      include /etc/nginx/asset-gate.conf;
      alias /var/www/nitro-assets/;
      add_header Cache-Control "private, max-age=604800";
    }

    # Housekeeping-uploaded game images (ads_picture_path /gamedata/custom,
    # badge parts under c_images). Filenames are ULIDs, so content never
    # changes under a URL — a long max-age is safe.
    location /gamedata/ {
      alias /var/www/gamedata/;
      add_header Cache-Control "public, max-age=604800";
      add_header Access-Control-Allow-Origin *;
    }

    # CMS avatar imager (nitro-imager) — renders custom clothing the habbo.com
    # imager can't. Resolve the upstream at request time (resolver + variable)
    # so nginx still boots when the imager container is down: a static upstream
    # makes nginx [emerg]-exit at startup, and with web having no restart policy
    # that wedges the whole site on a cold start. The rewrite strips /imaging/
    # so the upstream sees "/?figure=...". 127.0.0.11 is Docker's embedded DNS.
    location /imaging/ {
      resolver 127.0.0.11 valid=30s;
      set $imager_upstream imager;
      rewrite ^/imaging/(.*)$ /$1 break;
      proxy_pass http://$imager_upstream:3030;
      proxy_set_header Host $host;
      add_header Cache-Control "public, max-age=86400";
      add_header Access-Control-Allow-Origin *;
    }

    location /ws {
      proxy_pass http://emulator:2096;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
    }

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
      fastcgi_pass cms:9000;
      fastcgi_index index.php;
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    }
  }

  # pixelrp: the same asset tree with no pass check, for the imager - it
  # renders avatars server-side from gamedata and figure bundles and has no
  # player's cookies to show. Never published in compose (only :80 is), so
  # it is reachable from the compose network alone.
  server {
    listen 8088;

    location /nitro-assets/ {
      alias /var/www/nitro-assets/;
    }
  }
}
