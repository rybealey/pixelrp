worker_processes auto;
events { worker_connections 2048; }
http {
  include /etc/nginx/mime.types;
  # nitro-renderer's AssetManager only parses a bundle when the response
  # Content-Type is exactly application/octet-stream (see docker/nitro/README.md).
  types { application/octet-stream nitro; }
  sendfile on;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # Plain HTTP: redirect everything to HTTPS. Cloudflare handles the public
  # edge; this catches direct-IP and grey-cloud traffic.
  server {
    listen 80;
    server_name pixelrp.co www.pixelrp.co;
    return 301 https://pixelrp.co$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name pixelrp.co www.pixelrp.co;

    # Cloudflare origin certificate (mounted read-only from the host).
    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/html/public;
    index index.php;
    client_max_body_size 25m;

    # Mutable gamedata + client config: never cached (see dev nginx.conf for
    # the full reasoning — stale copies of these silently break the client).
    location /nitro-assets/assets/gamedata/ {
      alias /var/www/nitro-assets/assets/gamedata/;
      add_header Cache-Control "no-store";
    }
    location ~ ^/nitro-assets/client/(renderer-config\.json|ui-config\.json)$ {
      alias /var/www/nitro-assets/client/$1;
      add_header Cache-Control "no-store";
    }

    location /nitro-assets/ {
      alias /var/www/nitro-assets/;
      add_header Cache-Control "public, max-age=604800";
    }

    # Nitro WebSocket: wss://pixelrp.co/ws -> emulator. The emulator port is
    # never exposed publicly; this proxy is the only ingress.
    location /ws {
      proxy_pass http://emulator:2096;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
    }

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
      fastcgi_pass cms:9000;
      fastcgi_index index.php;
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
      fastcgi_param HTTPS on;
    }
  }
}
