# Nitro client + game asset host (same origin → no CORS needed).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    # Runtime-rendered configs must never be cached stale.
    location = /renderer-config.json { add_header Cache-Control "no-store"; }
    location = /ui-config.json      { add_header Cache-Control "no-store"; }

    # ./artifacts/nitro-assets is bind-mounted at html/game-assets (read-only).
    # NOT /assets — that's where vite emits the client's own hashed bundles.
    location /game-assets/ { }

    # Gamedata JSONs are regenerated by `make convert-assets`; without this the
    # browser serves a stale copy and you debug data you already fixed.
    # (.nitro bundles stay cacheable — they are content-addressed by name.)
    location /game-assets/gamedata/ { add_header Cache-Control "no-cache"; }

    # Image paths stored in the DB (hotelview_news.image,
    # catalog_target_offers.image, …) are relative to the c_images root, so the
    # client requests them at the web root — e.g. /web_promo_small/foo.png.
    # Resolve those into the asset tree, and 404 honestly when they're absent:
    # without this they fall through to the SPA rule below and return
    # index.html with a 200, which looks like a working image that won't draw.
    location ~* \.(png|gif|jpe?g|svg|webp|mp3)$ {
        try_files $uri /game-assets/c_images$uri =404;
    }

    # SPA fallback.
    location / { try_files $uri $uri/ /index.html; }
}
