# Production overlay: docker compose -f compose.yaml -f compose.prod.yaml up -d
#
# Topology on the VPS (pixelrp.co): the HOST nginx terminates TLS with the
# Cloudflare origin certs (/etc/ssl/pixelrp/) and proxies:
#   https://pixelrp.co        -> 127.0.0.1:8080  (our `web` container)
#   wss://pixelrp.co:2096     -> 127.0.0.1:2096  (our `emulator` Nitro port)
# All container ports stay loopback-bound exactly as in dev; nothing is
# exposed publicly except through the host nginx. This overlay only hardens
# runtime behavior:
#   - restart policies for unattended operation
#   - CMS in production mode with the public URL

services:
  db:
    restart: unless-stopped

  emulator:
    restart: unless-stopped

  cms:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://pixelrp.co
      # host nginx is the TLS proxy; trust it so X-Forwarded-Proto=https is honored
      TRUSTED_PROXIES: "*"
    restart: unless-stopped

  web:
    restart: unless-stopped
