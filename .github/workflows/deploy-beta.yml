# Deploy the beta hotel (beta.pixelrp.co) — fires automatically on every push
# to the `beta` branch. Same VPS as prod, separate checkout and compose
# project (see compose.beta.yaml); the live hotel is never touched.
#
# Uses the same DEPLOY_* secrets as deploy.yml. No backup step: the beta DB is
# a disposable clone (docker/beta/refresh-from-prod.sh recreates it).

name: Deploy Beta

on:
  push:
    branches: [beta]
  workflow_dispatch:

concurrency:
  group: deploy-beta
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Beta
    runs-on: ubuntu-latest
    env:
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
      DEPLOY_PATH: /opt/pixelrp-beta
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the Nitro client
        run: |
          corepack enable
          cd client
          yarn install --immutable
          yarn vite build --base=/nitro-assets/client/

      - name: Load SSH key and configure host verification
        id: ssh-setup
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          [ -n "$DEPLOY_SSH_KEY" ] || { echo "::error::DEPLOY_SSH_KEY secret is not set"; exit 1; }
          [ -n "$DEPLOY_HOST" ] || { echo "::error::DEPLOY_HOST secret is not set"; exit 1; }
          [ -n "$DEPLOY_USER" ] || { echo "::error::DEPLOY_USER secret is not set"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$DEPLOY_HOST_KEY" ]; then
            printf '%s\n' "$DEPLOY_HOST_KEY" >> ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_HOST_KEY not set — trusting the host key on first use for this run only."
            ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          printf 'Host vps\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_deploy\n  StrictHostKeyChecking yes\n' \
            "$DEPLOY_HOST" "$DEPLOY_USER" "$DEPLOY_PORT" >> ~/.ssh/config

      - name: Upload client and pull beta branch
        run: |
          # Beta's renderer-config.json / ui-config.json are VPS-only, same as
          # prod's — excluded from both overwrite and --delete.
          rsync -az --delete --info=stats2 \
            --exclude 'renderer-config.json' \
            --exclude 'ui-config.json' \
            client/dist/ vps:"$DEPLOY_PATH/nitro/client/"
          ssh vps "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          git fetch -q origin beta
          git checkout -q beta
          git reset -q --hard origin/beta
          git submodule update --init emulator cms
          git -C emulator log --oneline -1
          REMOTE

      - name: Apply database patches
        run: |
          ssh vps "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          COMPOSE="docker compose -p pixelrp-beta -f compose.yaml -f compose.prod.yaml -f compose.beta.yaml"
          dbsql() { (cd "$DEPLOY_PATH" && $COMPOSE exec -T db sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" exec mysql -N -uroot "$MYSQL_DATABASE"'); }
          echo "CREATE TABLE IF NOT EXISTS _applied_sql_updates (filename VARCHAR(255) PRIMARY KEY, applied_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP);" | dbsql
          applied=$(echo "SELECT filename FROM _applied_sql_updates;" | dbsql)
          cd emulator/Resources/SQLs/Updates
          for f in $(ls -1 *.sql | sort -V); do
            if printf '%s\n' "$applied" | grep -xF "$f" > /dev/null; then
              continue
            fi
            echo "applying: $f"
            dbsql < "$f"
            printf "INSERT INTO _applied_sql_updates (filename) VALUES ('%s');" "$f" | dbsql
          done
          REMOTE

      - name: Rebuild and restart beta
        run: |
          ssh vps "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          COMPOSE="docker compose -p pixelrp-beta -f compose.yaml -f compose.prod.yaml -f compose.beta.yaml"
          $COMPOSE build emulator cms 2>&1 | tail -3
          $COMPOSE stop cms
          $COMPOSE run --rm --no-deps -T cms \
            sh -c 'cp -a /opt/cms-public/. /var/www/html/public/' < /dev/null
          $COMPOSE run --rm --no-deps -T cms php artisan migrate --force < /dev/null
          dbsql() { $COMPOSE exec -T db sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" exec mysql -N -uroot "$MYSQL_DATABASE"'; }
          theme=$(grep -oE 'npm run build:[a-z0-9-]+' docker/cms/Dockerfile | head -1 | cut -d: -f2)
          [ -n "$theme" ] || { echo "::error::could not read the built theme from docker/cms/Dockerfile"; exit 1; }
          printf "UPDATE website_settings SET value='%s' WHERE \`key\`='theme';\n" "$theme" | dbsql
          $COMPOSE up -d < /dev/null
          $COMPOSE exec -T cms php artisan optimize:clear < /dev/null
          REMOTE

      - name: Wait for the beta emulator
        run: |
          ssh vps "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          COMPOSE="docker compose -p pixelrp-beta -f compose.yaml -f compose.prod.yaml -f compose.beta.yaml"
          cid=$($COMPOSE ps -q emulator)
          started=$(docker inspect -f '{{.State.StartedAt}}' "$cid")
          deadline=$((SECONDS + 300))
          until docker logs --since "$started" "$cid" 2>&1 | grep -qF 'EMULATOR -> READY'; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Beta emulator did not report READY within 300s"
              docker logs --since "$started" "$cid" 2>&1 | tail -30
              exit 1
            fi
            sleep 5
          done
          echo "Beta emulator is READY."
          REMOTE

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy
