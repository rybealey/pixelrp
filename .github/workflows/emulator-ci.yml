# Compile-checks the emulator on every beta/main push so a C# error surfaces
# as readable annotations here instead of dying inside the VPS docker build
# (whose output the deploy trims to a few lines). No deploy, no secrets.

name: Emulator Build Check

on:
  push:
    # Feature branches are included deliberately. Pushing to `beta` AUTO-DEPLOYS
    # (deploy-beta.yml), so while this only fired on beta/main the only way to
    # compile-check anything was to deploy it - and there is no .NET SDK on the
    # dev machine, so "does it build" could not be answered any other way. That
    # is how a freeze reached the live beta hotel three times.
    # Now a long-running branch like movement-v2-cutover gets a real compile
    # gate with no deploy attached.
    branches: [beta, main, 'movement-**', 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: dotnet build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out the emulator submodule
        run: git submodule update --init emulator

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      # Annotate ERRORS ONLY: the stock csc problem matcher floods the
      # 10-annotation cap with the codebase's pre-existing nullability
      # warnings, crowding the actual compile errors out.
      - name: Disable the warning-flooding matcher
        run: echo "::remove-matcher owner=csc::"

      - name: Build
        run: |
          set -o pipefail
          dotnet build "emulator/Plus Emulator.csproj" -c Release 2>&1 | tee build.log | tail -5 || true
          if grep -qE "error [A-Z]+[0-9]+" build.log; then
            grep -E "error [A-Z]+[0-9]+" build.log | sort -u | head -10 | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          fi
