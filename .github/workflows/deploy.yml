# Deploy to VPS — the run the in-client "Update in progress" screen tracks.
#
# Trigger it deliberately (pushes to main are often docs/changelog-only and
# must not restart the hotel):
#   gh workflow run deploy.yml        # or the Actions tab → Run workflow
#
# The five SSH steps are named exactly what players see as progress phases —
# the CMS's /api/deploy-status maps step names to the screen's step text, so
# renaming them changes (or breaks) what the deployment screen displays.
#
# Required secrets (workflow fails fast on the first SSH step without them):
#   DEPLOY_SSH_KEY   private key authorized on the VPS
#   DEPLOY_HOST      e.g. 67.219.109.182
#   DEPLOY_USER      e.g. root
#   DEPLOY_HOST_KEY  output of: ssh-keyscan -p <port> -H <host>  (recommended)
#   DEPLOY_PORT      optional, default 22
#   DEPLOY_PATH      optional, default /opt/pixelrp

name: Deploy to VPS

on:
  workflow_dispatch:

# One deploy at a time; queue rather than interrupt. An interrupted deploy can
# leave the live hotel half-deployed (mid-migration, orphaned build).
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/pixelrp' }}
      COMPOSE: docker compose -f compose.yaml -f compose.prod.yaml
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # client source is needed for the build below

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The VPS has no Node — the client is always built off-box and only the
      # dist output is shipped (docker/nitro/README.md). corepack activates
      # the Yarn pinned in client/package.json; the runner's default yarn 1
      # cannot read the Berry lockfile and silently re-resolves dependencies.
      - name: Build the Nitro client
        run: |
          corepack enable
          cd client
          yarn install --immutable
          yarn vite build --base=/nitro-assets/client/

      - name: Load SSH key and configure host verification
        id: ssh-setup
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          [ -n "$DEPLOY_SSH_KEY" ] || { echo "::error::DEPLOY_SSH_KEY secret is not set"; exit 1; }
          [ -n "$DEPLOY_HOST" ] || { echo "::error::DEPLOY_HOST secret is not set"; exit 1; }
          [ -n "$DEPLOY_USER" ] || { echo "::error::DEPLOY_USER secret is not set"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$DEPLOY_HOST_KEY" ]; then
            # Must be keyed for the same port as DEPLOY_PORT ([host]:port
            # entries when the port is not 22) or every deploy fails with
            # "Host key verification failed".
            printf '%s\n' "$DEPLOY_HOST_KEY" >> ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_HOST_KEY not set — trusting the host key on first use for this run only."
            ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          # Keepalives: without them a dropped connection leaves the step
          # hanging silently until the 6h job timeout instead of failing.
          printf 'Host vps\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_deploy\n  StrictHostKeyChecking yes\n  ServerAliveInterval 15\n  ServerAliveCountMax 4\n' \
            "$DEPLOY_HOST" "$DEPLOY_USER" "$DEPLOY_PORT" >> ~/.ssh/config

      # SIGTERM → PerformShutDown(): goodbye broadcast, inventory save, clean
      # disconnect (players' screens switch to the deployment view here), then
      # a DB dump while nothing is writing.
      - name: Backing up city data
        run: |
          ssh vps "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          docker compose -f compose.yaml -f compose.prod.yaml stop emulator
          mkdir -p /opt/pixelrp-backups
          docker compose -f compose.yaml -f compose.prod.yaml exec -T db \
            sh -c 'exec mysqldump -uroot -p"$MYSQL_ROOT_PASSWORD" --single-transaction "$MYSQL_DATABASE"' \
            | gzip > "/opt/pixelrp-backups/deploy-$(date +%Y%m%d-%H%M%S).sql.gz"
          # Keep the newest 10 deploy dumps.
          ls -1t /opt/pixelrp-backups/deploy-*.sql.gz | tail -n +11 | xargs -r rm --
          REMOTE

      - name: Uploading new assets
        run: |
          # Prod renderer-config.json / ui-config.json live only on the VPS
          # (git-ignored) — exclude protects them from both overwrite and
          # --delete.
          rsync -az --delete --info=stats2 \
            --exclude 'renderer-config.json' \
            --exclude 'ui-config.json' \
            client/dist/ vps:"$DEPLOY_PATH/nitro/client/"
          ssh vps "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          git pull -q origin main
          git submodule update --init emulator cms
          git -C emulator log --oneline -1
          # Fresh patch notes for the deployment screen (a bind mount would
          # pin the pre-pull inode).
          docker compose -f compose.yaml -f compose.prod.yaml exec -T cms mkdir -p /changelog
          docker compose -f compose.yaml -f compose.prod.yaml cp CHANGELOG.md cms:/changelog/CHANGELOG.md
          REMOTE

      # Replays emulator/Resources/SQLs/Updates/*.sql that are not yet in the
      # _applied_sql_updates table. On the table's first creation every file
      # already on disk is recorded WITHOUT running it — prod predates this
      # mechanism and already has 1–18 applied by hand. If that same first
      # deploy also introduces new SQL, apply it manually once.
      - name: Applying database patches
        run: |
          ssh vps "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          # Subshell cd: the compose -f paths are relative, and the loop below
          # runs from the SQL updates directory.
          dbsql() { (cd "$DEPLOY_PATH" && docker compose -f compose.yaml -f compose.prod.yaml exec -T db sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" exec mysql -N -uroot "$MYSQL_DATABASE"'); }
          echo "CREATE TABLE IF NOT EXISTS _applied_sql_updates (filename VARCHAR(255) PRIMARY KEY, applied_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP);" | dbsql
          applied=$(echo "SELECT filename FROM _applied_sql_updates;" | dbsql)
          cd emulator/Resources/SQLs/Updates
          if [ -z "$applied" ]; then
            for f in *.sql; do
              printf "INSERT IGNORE INTO _applied_sql_updates (filename) VALUES ('%s');\n" "$f"
            done | dbsql
            echo "baselined $(ls -1 *.sql | wc -l) updates as already applied by hand"
          else
            for f in $(ls -1 *.sql | sort -V); do
              if printf '%s\n' "$applied" | grep -xF "$f" > /dev/null; then
                continue
              fi
              echo "applying: $f"
              dbsql < "$f"
              printf "INSERT INTO _applied_sql_updates (filename) VALUES ('%s');" "$f" | dbsql
            done
          fi
          REMOTE

      - name: Restarting districts
        run: |
          ssh vps "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          docker compose -f compose.yaml -f compose.prod.yaml build emulator cms 2>&1 | tail -3
          # CMS migrations run here, not in "Applying database patches": prod
          # has no ./cms bind mount, so the running container is the previous
          # image and does not contain migrations added by this deploy. A
          # one-off container off the image just built does.
          #
          # Order matters. The theme's assets are baked per-theme (the Vite
          # manifest only holds the built theme), so website_settings.theme and
          # the image have to agree - migrate before the containers swap in, or
          # the new container serves a theme whose assets it does not have.
          #
          # cms is stopped for both: the service holds a static IP, so a one-off
          # container cannot start alongside the running one ("Address already
          # in use"), and this way the container comes back up already
          # consistent instead of briefly serving a half-updated state.
          docker compose -f compose.yaml -f compose.prod.yaml stop cms
          # Refresh public/ from the image. cms-public is only seeded when
          # Docker first creates it, so built assets are otherwise frozen at
          # whatever the volume was created with. Overlay, not replace - the
          # volume also holds runtime content that is not in the image.
          docker compose -f compose.yaml -f compose.prod.yaml run --rm --no-deps -T cms \
            sh -c 'cp -a /opt/cms-public/. /var/www/html/public/' < /dev/null
          # -T throughout: without it compose wants a TTY the SSH heredoc has
          # not got, and the commands' output never reaches the run log.
          # Status first, so the run log records exactly what was pending.
          docker compose -f compose.yaml -f compose.prod.yaml run --rm --no-deps -T cms php artisan migrate:status < /dev/null
          docker compose -f compose.yaml -f compose.prod.yaml run --rm --no-deps -T cms php artisan migrate --force < /dev/null
          # The image bakes exactly one theme's assets (the Vite manifest holds
          # only the theme that was built), so website_settings.theme has to
          # name that same theme or @vite throws on every page. Taken from the
          # Dockerfile rather than a migration: this is a property of the image
          # being deployed, and it has to hold on every deploy, not once.
          dbsql() { docker compose -f compose.yaml -f compose.prod.yaml exec -T db sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" exec mysql -N -uroot "$MYSQL_DATABASE"'; }
          theme=$(grep -oE 'npm run build:[a-z0-9-]+' docker/cms/Dockerfile | head -1 | cut -d: -f2)
          [ -n "$theme" ] || { echo "::error::could not read the built theme from docker/cms/Dockerfile"; exit 1; }
          echo "image ships theme: $theme"
          printf "UPDATE website_settings SET value='%s' WHERE \`key\`='theme';\n" "$theme" | dbsql
          echo "website_settings.theme is now: $(echo "SELECT value FROM website_settings WHERE \`key\`='theme';" | dbsql)"
          docker compose -f compose.yaml -f compose.prod.yaml up -d < /dev/null
          # Config/route/view caches are baked per-image; drop anything the old
          # container left in the mounted storage volume.
          docker compose -f compose.yaml -f compose.prod.yaml exec -T cms php artisan optimize:clear < /dev/null
          # A recreated cms container starts without /changelog — re-seed it.
          docker compose -f compose.yaml -f compose.prod.yaml exec -T cms mkdir -p /changelog
          docker compose -f compose.yaml -f compose.prod.yaml cp CHANGELOG.md cms:/changelog/CHANGELOG.md
          REMOTE

      # The run (and the deployment screen) only turns green once the emulator
      # is actually accepting players again.
      - name: Polishing pixels
        run: |
          ssh vps "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          cid=$(docker compose -f compose.yaml -f compose.prod.yaml ps -q emulator)
          started=$(docker inspect -f '{{.State.StartedAt}}' "$cid")
          deadline=$((SECONDS + 300))
          until timeout 20 docker logs --since "$started" --tail 500 "$cid" 2>&1 | grep -qF 'EMULATOR -> READY'; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Emulator did not report READY within 300s"
              timeout 20 docker logs --since "$started" --tail 30 "$cid" 2>&1 || true
              exit 1
            fi
            sleep 5
          done
          echo "Emulator is READY."
          REMOTE

      # A deploy that dies between "stop emulator" and "restart" must not
      # leave the hotel offline — bring everything back up with whatever
      # images exist before the run goes red.
      - name: Bring the hotel back up after a failed deploy
        if: failure() && steps.ssh-setup.outcome == 'success'
        run: |
          ssh vps "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          docker compose -f compose.yaml -f compose.prod.yaml up -d
          docker compose -f compose.yaml -f compose.prod.yaml ps --format '{{.Name}} {{.State}}'
          REMOTE

      # Cap the BuildKit cache so it can't balloon (it hit 54GB once because
      # nothing pruned it). No `if:` -> runs only on a successful deploy, so a
      # failed build keeps its cache for a fast retry. Never fails the deploy.
      - name: Prune build cache
        run: ssh vps 'docker builder prune -f --max-used-space 10GB || true'

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy
