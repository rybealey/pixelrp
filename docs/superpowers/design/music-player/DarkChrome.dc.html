  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&amp;display=swap">
  <style>
    body { margin: 0; background: #5b6b7f; font-family: Ubuntu, 'Segoe UI', system-ui, sans-serif; }
    a { color: #1E7295; } a:hover { color: #185D79; }

  .halo { position:absolute; inset:-5px; border-radius:13px; overflow:hidden; filter:blur(9px); opacity:.9; }
  .halo::before { content:''; position:absolute; left:50%; top:50%; width:220%; aspect-ratio:1;
    background:conic-gradient(#8a3566, #1E7295, #59a9c0, #b3549c, #8a3566); animation:halo-spin 14s linear infinite; }
  .halo.is-soft { opacity:.55; filter:blur(11px); }
  @keyframes halo-spin { from { transform:translate(-50%,-50%) rotate(0deg) } to { transform:translate(-50%,-50%) rotate(360deg) } }
  .wave path { fill:none; stroke-width:1.5; stroke-linecap:round; }
  .wave .drift { animation:wave-drift linear infinite; }
  .wave .breathe { transform-box:fill-box; transform-origin:center; animation:wave-breathe ease-in-out infinite; }
  .wave .a { animation-duration:2.1s } .wave .a path { stroke:#8a3566; opacity:.9 } .wave .a .breathe { animation-duration:1.7s }
  .wave .b { animation-duration:3.4s } .wave .b path { stroke:#1E7295; opacity:.7 } .wave .b .breathe { animation-duration:2.6s; animation-delay:-.9s }
  .wave .c { animation-duration:5.1s } .wave .c path { stroke:#59a9c0; opacity:.5 } .wave .c .breathe { animation-duration:3.9s; animation-delay:-2.1s }
  .wave.on-dark .a path { stroke:#d67bb4 } .wave.on-dark .b path { stroke:#59a9c0 } .wave.on-dark .c path { stroke:#9fd6e6 }
  @keyframes wave-drift { from { transform:translateX(0) } to { transform:translateX(-22px) } }
  @keyframes wave-breathe { 0%,100% { transform:scaleY(.4) } 50% { transform:scaleY(1) } }
  @media (prefers-reduced-motion: reduce) { .halo::before, .wave .drift, .wave .breathe { animation:none } }
  </style>
</helmet>
