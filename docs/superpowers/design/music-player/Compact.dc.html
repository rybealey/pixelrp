<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&amp;display=swap">
  <style>
    body { margin: 0; background: #5b6b7f; font-family: Ubuntu, 'Segoe UI', system-ui, sans-serif; }
    a { color: #1E7295; } a:hover { color: #185D79; }

  .halo { position:absolute; inset:-5px; border-radius:13px; overflow:hidden; filter:blur(9px); opacity:.9; }
  .halo::before { content:''; position:absolute; left:50%; top:50%; width:220%; aspect-ratio:1;
    background:conic-gradient(#8a3566, #1E7295, #59a9c0, #b3549c, #8a3566); animation:halo-spin 14s linear infinite; }
  .halo.is-soft { opacity:.55; filter:blur(11px); }
  @keyframes halo-spin { from { transform:translate(-50%,-50%) rotate(0deg) } to { transform:translate(-50%,-50%) rotate(360deg) } }
  .wave path { fill:none; stroke-width:1.5; stroke-linecap:round; }
  .wave .drift { animation:wave-drift linear infinite; }
  .wave .breathe { transform-box:fill-box; transform-origin:center; animation:wave-breathe ease-in-out infinite; }
  .wave .a { animation-duration:2.1s } .wave .a path { stroke:#8a3566; opacity:.9 } .wave .a .breathe { animation-duration:1.7s }
  .wave .b { animation-duration:3.4s } .wave .b path { stroke:#1E7295; opacity:.7 } .wave .b .breathe { animation-duration:2.6s; animation-delay:-.9s }
  .wave .c { animation-duration:5.1s } .wave .c path { stroke:#59a9c0; opacity:.5 } .wave .c .breathe { animation-duration:3.9s; animation-delay:-2.1s }
  .wave.on-dark .a path { stroke:#d67bb4 } .wave.on-dark .b path { stroke:#59a9c0 } .wave.on-dark .c path { stroke:#9fd6e6 }
  @keyframes wave-drift { from { transform:translateX(0) } to { transform:translateX(-22px) } }
  @keyframes wave-breathe { 0%,100% { transform:scaleY(.4) } 50% { transform:scaleY(1) } }
  @media (prefers-reduced-motion: reduce) { .halo::before, .wave .drift, .wave .breathe { animation:none } }
  </style>
</helmet>

><g class="breathe"><path d="M0 8 C2.75 3 8.25 3 11 8 C13.75 13 19.25 13 22 8 C24.75 3 30.25 3 33 8 C35.75 13 41.25 13 44 8"></path></g></g></svg></span><div style="font-size:9px;font-weight:700;letter-spacing:.5px;color:rgba(40,63,93,0.55);">NOW PLAYING</div></div><div style="font-size:12px;font-weight:700;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">EMELINE - 99 boys (Lyric Video)</div></div></div><div style="display:flex;align-items:center;gap:8px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(40,63,93,0.7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M11 5 6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg><div style="position:relative;flex:1;height:4px;border-radius:2px;background:rgba(40,63,93,0.15)"><div style="position:absolute;left:0;top:0;bottom:0;width:52%;border-radius:2px;background:linear-gradient(90deg,#8a3566,#1E7295)"></div><div style="position:absolute;top:50%;left:52%;width:12px;height:12px;border-radius:50%;background:#fff;border:1.5px solid #283F5D;transform:translate(-50%,-50%);box-sizing:border-box"></div></div><span style="display:inline-flex;align-items:center;gap:4px;flex-shrink:0;padding:3px 8px;border-radius:10px;background:rgba(30,114,149,0.10);box-shadow:inset 0 0 0 1px rgba(40,63,93,0.14);font-size:9px;font-weight:700;letter-spacing:.4px;color:rgba(40,63,93,0.7);cursor:pointer"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="rgba(40,63,93,0.7)" stroke-width="1.8" stroke-linecap="round" style="flex-shrink:0"><path d="M6 1.5v9M1.5 6h9"></path></svg>QUEUE</span></div></div></div></div></div>
