<div style="display:inline-flex;padding:36px;background:#5b6b7f"><div style="padding:22px;background:#0a0a0a;border-radius:12px;width:1060px;box-sizing:border-box;font-family:Ubuntu, 'Segoe UI', system-ui, sans-serif"><div style="font-size:10px;font-weight:700;letter-spacing:1px;color:rgba(255,255,255,.55);margin-bottom:12px">CLEAR SKY THROUGH THE DAY · SAN FRANCISCO TIME</div><div style="display:flex;gap:14px;justify-content:space-between"><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:150px;height:96px;border-radius:8px;background:linear-gradient(180deg,#05070f,#0a1020,#101a30)"></div><div style="font-size:11px;font-weight:700;color:rgba(255,255,255,.8);letter-spacing:.3px">12 AM</div></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:150px;height:96px;border-radius:8px;background:linear-gradient(180deg,#0d1424,#1c2438,#3a3a4a)"></div><div style="font-size:11px;font-weight:700;color:rgba(255,255,255,.8);letter-spacing:.3px">5 AM · dawn</div></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:150px;height:96px;border-radius:8px;background:linear-gradient(180deg,#121b2c,#1c2b44,#2c4466)"></div><div style="font-size:11px;font-weight:700;color:rgba(255,255,255,.8);letter-spacing:.3px">8 AM</div></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:150px;height:96px;border-radius:8px;background:linear-gradient(180deg,#141d2e,#1d2b44,#33507a)"></div><div style="font-size:11px;font-weight:700;color:rgba(255,255,255,.8);letter-spacing:.3px">1 PM</div></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:150px;height:96px;border-radius:8px;background:linear-gradient(180deg,#121420,#2a1c22,#5a3418)"></div><div style="font-size:11px;font-weight:700;color:rgba(255,255,255,.8);letter-spacing:.3px">6 PM · dusk</div></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:150px;height:96px;border-radius:8px;background:linear-gradient(180deg,#070a14,#0d1526,#182644)"></div><div style="font-size:11px;font-weight:700;color:rgba(255,255,255,.8);letter-spacing:.3px">9 PM</div></div></div><div style="margin-top:18px;display:flex;flex-direction:column;gap:6px"><div style="font-size:10px;font-weight:700;letter-spacing:1px;color:rgba(255,255,255,.55)">LIGHTNESS BUDGET</div><div style="position:relative;height:14px;border-radius:7px;background:linear-gradient(90deg,#000,#fff)"><div style="position:absolute;left:0;top:0;bottom:0;width:30%;border-radius:7px 0 0 7px;box-shadow:inset 0 0 0 2px #2bd66a"></div><div style="position:absolute;left:65%;top:-4px;width:2px;height:22px;background:#a9a77b"></div></div><div style="display:flex;justify-content:space-between;font-size:10.5px;color:rgba(255,255,255,.6)"><span>Skies live here: 0 to 30% lightness, brightest at the horizon only</span><span style="color:#a9a77b">Room floor ≈ 65%</span></div></div></div></div>
