<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&amp;family=Barlow:wght@400;500;600;700&amp;display=swap">
  <style>
:root{
  --bg:#100d14; --card:#171021; --hair:#292136; --inset:#251d31;
  --text:#f4f0f7; --muted:#8f8699; --faint:#7d7590; --soft:#9a90a5;
  --need:#e93a7d; --idle:#4b4359;
}
body{margin:0;background:#3d4654;font-family:Ubuntu,'Segoe UI',system-ui,sans-serif}
a{color:#e93a7d}a:hover{color:#c22a62}
.stage{display:inline-flex;padding:36px;background:#3d4654}
.ph{position:relative;width:336px;height:700px;border-radius:30px;overflow:hidden;
  background:#100d14;font-family:Ubuntu,'Segoe UI',system-ui,sans-serif;color:var(--text);
  box-shadow:0 0 0 8px #1a0a14,0 0 0 10px #e87332}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.island{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:112px;height:33px;
  background:#000;border-radius:18px;z-index:41}
.sb{position:absolute;top:0;left:0;right:0;height:44px;z-index:40;display:flex;align-items:center;
  justify-content:space-between;padding:0 22px;box-sizing:border-box;color:#fff}
.sb-t{font-weight:500;font-size:13px;letter-spacing:.5px}
.sb-r{display:flex;align-items:center;gap:7px}
.sb-c{font-weight:500;font-size:11px;letter-spacing:.5px}
.bars{display:flex;align-items:flex-end;gap:1.5px;height:12px}
.bars i{width:3px;border-radius:1px;background:currentColor;align-self:flex-end;display:block}
.batt{position:relative;width:18px;height:10px;border:1.3px solid currentColor;border-radius:3px;display:inline-block}
.batt i{position:absolute;inset:1.5px;background:currentColor;border-radius:1px;display:block}
.hi{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:112px;height:5px;
  border-radius:3px;background:#fff;opacity:.85;z-index:45}
.glare{position:absolute;inset:0;pointer-events:none;z-index:100;border-radius:30px;
  background:linear-gradient(125deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,.05) 15%,
  rgba(255,255,255,0) 34%,rgba(255,255,255,0) 66%,rgba(255,255,255,.04) 100%)}
.body{flex:1;min-height:0;overflow:hidden;padding-top:44px}

.hdr{padding:10px 18px 6px}
.kicker{display:flex;align-items:center;gap:5px;font-weight:700;font-size:9px;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--faint)}
.dot{width:5px;height:5px;border-radius:50%;background:var(--need);flex:none;
  box-shadow:0 0 0 3px rgba(233,58,125,.16)}
.title{font-weight:700;font-size:27px;letter-spacing:-.5px;line-height:1.1;color:var(--text)}
.sub-h{margin-top:3px;font-family:Barlow,sans-serif;font-size:12px;line-height:1.4;color:var(--muted)}

/* a row is the horizontal read plus, at its foot, how full they are */
.list{padding:6px 18px 0;display:flex;flex-direction:column}
.row{display:flex;flex-direction:column;justify-content:center;gap:9px;height:76px;
  box-sizing:border-box}
.row+.row{border-top:1px solid var(--hair)}
.rmain{display:flex;align-items:center;gap:12px}
.rlead{flex:1;min-width:0}
.tick{font-weight:700;font-size:16px;letter-spacing:.2px;line-height:1.2;color:var(--text)}
.corp{font-family:Barlow,sans-serif;font-size:11.5px;line-height:1.35;color:var(--muted);
  margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:128px}
.spark{flex:none;width:60px;height:30px}
.rtail{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:74px}
.val{font-weight:500;font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.chip{min-width:64px;box-sizing:border-box;padding:3px 7px;border-radius:6px;text-align:center;
  font-weight:700;font-size:11px;font-variant-numeric:tabular-nums;color:#fff}
.cap{position:relative;height:3px;border-radius:2px;background:var(--inset);overflow:hidden}
.capfill{position:absolute;left:0;top:0;bottom:0;border-radius:2px}

.back{display:flex;align-items:center;gap:2px;color:var(--need);font-weight:500;font-size:14px}
.dhead{padding:2px 18px 0}
.dtick{font-weight:700;font-size:30px;letter-spacing:-.4px;line-height:1.1}
.dcorp{font-family:Barlow,sans-serif;font-size:13px;color:var(--muted);margin-top:2px}
.dval{margin-top:12px;font-weight:500;font-size:38px;line-height:1;letter-spacing:-1px;
  font-variant-numeric:tabular-nums}
.dunit{font-size:15px;font-weight:500;color:var(--faint);letter-spacing:0}
.dfull{margin-top:9px;display:flex;align-items:baseline;justify-content:space-between}
.dfull b{font-weight:700;font-size:12.5px;color:var(--need);letter-spacing:.2px}
.dfull span{font-family:Barlow,sans-serif;font-size:11.5px;color:var(--faint)}
.dcap{margin-top:6px;position:relative;height:6px;border-radius:3px;background:var(--inset);
  overflow:hidden}
.dchg{margin-top:11px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;
  font-variant-numeric:tabular-nums}
.dstamp{font-family:Barlow,sans-serif;font-weight:400;font-size:11.5px;color:var(--faint);
  letter-spacing:.2px}
.banner{margin:13px 18px 0;padding:9px 12px;border-radius:11px;
  background:rgba(233,58,125,.12);border:1px solid rgba(233,58,125,.3)}
.banner b{font-weight:700;font-size:12px;color:var(--need);letter-spacing:.2px}
.seg{margin:13px 18px 0;display:flex;padding:2px;border-radius:11px;background:var(--inset)}
.segopt{flex:1;padding:5px 0;border-radius:9px;text-align:center;font-weight:700;font-size:11.5px;
  font-variant-numeric:tabular-nums;color:var(--soft)}
.segopt.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.stats{margin:14px 18px 0;display:flex;border-top:1px solid var(--hair);
  border-bottom:1px solid var(--hair)}
.stat{flex:1;padding:9px 0}
.stat+.stat{padding-left:12px;border-left:1px solid var(--hair)}
.stat span{display:block;font-weight:700;font-size:8.5px;letter-spacing:1.1px;text-transform:uppercase;
  color:var(--faint)}
.stat b{display:block;margin-top:3px;font-weight:500;font-size:15px;font-variant-numeric:tabular-nums;
  color:var(--text)}
.desc{padding:12px 18px 0;font-family:Barlow,sans-serif;font-size:12.5px;line-height:1.5;
  color:var(--soft)}

.sheet{width:408px;box-sizing:border-box;padding:26px 24px 28px;background:#100d14;
  display:flex;flex-direction:column;gap:20px}
.sheet-h{font-weight:700;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint)}
.spec{display:flex;flex-direction:column;gap:7px}
.spec-l{font-family:Barlow,sans-serif;font-size:11.5px;line-height:1.4;color:var(--muted)}
.frame{width:300px;padding:0 12px;box-sizing:border-box;border-radius:12px;background:var(--card);
  border:1px solid var(--hair)}
.flash{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{background:rgba(233,58,125,0)}18%{background:rgba(233,58,125,.14)}}
</style>
</helmet>
<div class="stage"><div class="ph"><div class="scr"><div class="body">
<div class="hdr">
  <div class="kicker"><span class="dot"></span>Live &middot; updated 12s ago</div>
  <div class="title">Stocks</div>
  <div class="sub-h">Most room first.</div>
</div>

</div></div><div class="island"></div><div class="sb"><div class="sb-t">21:04</div><div class="sb-r"><span class="sb-c">PXL</span><span class="bars"><i style="height:5px"></i><i style="height:7.5px"></i><i style="height:10px"></i><i style="height:12px"></i></span><span class="batt"><i></i></span></div></div><div class="hi"></div><div class="glare"></div></div></div>
</x-dc>
</body>
</html>
